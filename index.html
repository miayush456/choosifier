<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choosifier — Kya Dekhein Aaj?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="header-row">
      <div class="logo-col">
        <div class="logo">
          <span class="CHOOS">CHOOS</span><span class="dot"></span><span class="ifier">IFIER</span>
        </div>
        <div class="tagline">Ek Show Chuno, Bina Confuse Hue</div>
      </div>

      <div class="search-wrap">
        <div class="search-box">
          <div class="search-wrap">
  <div class="search-box">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input type="text" id="searchInput" placeholder="Show ya genre search karo...">
  </div>

  <div class="search-note">
    <button class="dummy-btn" disabled>+</button>
    <span>Use this button to buy any webseries/movies from our Telegram</span>
  </div>
</div>
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
         <input type="text" id="searchInput" placeholder="Show ya genre search karo...">
        </div>
      </div>
    </div>
  </header>

  <div class="filter-container">
    <button class="filter-btn active" onclick="filterCategory('all', this)">All</button>
    <button class="filter-btn" onclick="filterCategory('korean', this)">K-Drama Picks</button>
    <button class="filter-btn" onclick="filterCategory('movie', this)">Movies</button>
  </div>

  <div class="section-label" id="sectionHeading">All Recommendation</div>

  <div class="drama-list" id="mainDisplayList"></div>

  <!-- In dono containers mein data.js/loadData() partial files se cards inject karta hai -->
  <div id="korean-container" style="display: none;"></div>
  <div id="movie-container" style="display: none;"></div>

  <div class="detail-panel" id="detailPanel">
    <button class="detail-close" onclick="closeDetail()">✕</button>
    <div class="detail-poster-frame">
      <img id="detailImg" src="" alt="">
    </div>
    <h2 id="detailTitle"></h2>
    <div class="detail-tags" id="detailTags"></div>
    <p id="detailDesc"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
