<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Queen of Tears — Choosifier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;
    --red:#e6304a;
    --teal:#17b8a6;
    --text:#f2f0ec;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:36px 24px;
    text-align:left;
  }
  .poster-img{
    width:180px;
    border-radius:10px;
    margin-bottom:16px;
    display:block;
  }
  h1{
    font-family:'Anton', sans-serif;
    font-size:42px;
    color:var(--red);
  }
</style>
</head>
<body>
  <img src="images/queen-of-tears.jpeg" alt="Queen of Tears poster" class="poster-img">
  <h1>Queen of Tears</h1>
</body>
</html>
